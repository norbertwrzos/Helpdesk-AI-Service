services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk_ai
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  greenmail:
    image: greenmail/standalone:2.0.1
    container_name: helpdesk_greenmail
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:test@localhost
        -Dgreenmail.api.hostname=0.0.0.0
        -Dgreenmail.api.port=8080
    ports:
      - "3025:3025"
      - "3143:3143"
      - "8080:8080"

volumes:
  postgres_data:
